name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_name: cherm-linux-x86_64
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_name: cherm-macos-arm64
          - os: macos
            arch: x86_64
            runner: macos-13
            artifact_name: cherm-macos-x86_64
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_name: Cherm.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools and dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller scikit-learn numpy fastmcp uvicorn websockets || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            pip install windows-curses || true
          fi

      - name: Build binary on Linux / macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd check-in-terminal
          pyinstaller --onefile --name cherm \
            --clean \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module torchaudio \
            --exclude-module matplotlib \
            --exclude-module pandas \
            --exclude-module PIL \
            --add-data "cherm_commands.json:." \
            --add-data "cherm_mindmap.html:." \
            cherm.py
          mkdir -p ../dist
          cp dist/cherm ../${{ matrix.artifact_name }}
          chmod +x ../${{ matrix.artifact_name }}

      - name: Build binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd check-in-terminal
          pyinstaller --onefile --name Cherm `
            --clean `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            --exclude-module matplotlib `
            --exclude-module pandas `
            --exclude-module PIL `
            --add-data "cherm_commands.json;." `
            --add-data "cherm_mindmap.html;." `
            cherm.py
          Copy-Item -Path "dist\Cherm.exe" -Destination "..\Cherm.exe"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Gather release assets
        run: |
          mkdir -p release_assets
          find all_artifacts -type f -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
